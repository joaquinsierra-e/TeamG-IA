version: '3.8'

services:
  # Servicio de tu App en Next.js (TeamG Agent)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teamg-app
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: always

  # Servicio de Ollama para los modelos IA
  ollama:
    image: ollama/ollama:latest
    container_name: teamg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  ollama_data: